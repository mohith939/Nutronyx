name: Deploy to Sunlight Host

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: Sync Code to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync Changed Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'balaji/Nutronyx/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            storage/*.sqlite*
            storage/*.sqlite-wal*
            storage/*.sqlite-shm*
            scratch/**
            .env*
            *.zip
            *.tar.gz
            .DS_Store
